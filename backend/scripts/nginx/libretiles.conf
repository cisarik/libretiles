# Render YOUR_DOMAIN, PROJECT_ROOT, and the certificate paths before installing.
# This file is included from nginx's http context; it is not nginx.conf.
map $http_upgrade $libretiles_connection_upgrade {
    default upgrade;
    '' close;
}

# Deliberately excludes query strings, Authorization, cookies, and Referer.
log_format libretiles '$remote_addr - [$time_local] '
                      '"$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent';

server {
    listen 80;
    server_name YOUR_DOMAIN;
    access_log /var/log/nginx/libretiles-access.log libretiles;
    return 301 https://YOUR_DOMAIN$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name YOUR_DOMAIN;

    ssl_certificate CERTIFICATE_PATH;
    ssl_certificate_key CERTIFICATE_KEY_PATH;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/libretiles-access.log libretiles;

    if ($host != YOUR_DOMAIN) {
        return 444;
    }

    location ^~ /api/ai/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
        gzip off;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
    }

    location = /api/models {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
        proxy_cache off;
    }

    location = /api/models/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;

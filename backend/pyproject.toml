[tool.poetry]
name = "libretiles-backend"
version = "0.1.0"
description = "Libre Tiles — Django backend for a web-based Libre Tiles game with AI opponents via OpenRouter free rivals."
authors = ["Libre Tiles Contributors"]
readme = "../README.md"
packages = [{ include = "config" }, { include = "gamecore" }, { include = "game" }, { include = "accounts" }, { include = "catalog" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
django = "^5.1"
channels = "^4.2"
channels-redis = "^4.2"
daphne = "^4.1"
djangorestframework = "^3.15"
djangorestframework-simplejwt = "^5.3"
django-cors-headers = "^4.4"
psycopg = { version = "^3.2", extras = ["binary"] }
httpx = ">=0.27.0,<1.0.0"
python-dotenv = "^1.0.1"
django-axes = "==8.3.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-django = "^4.8"
pytest-asyncio = "^1.2.0"
ruff = "^0.5.0"
mypy = "^1.10.0"
django-stubs = "^5.0"
djangorestframework-stubs = "^3.15"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

# channels has no published type stubs; do not install types-channels or weaken global strictness.
[[tool.mypy.overrides]]
module = [
    "channels.db",
    "channels.generic.websocket",
    "channels.layers",
    "channels.routing",
    "channels.security.websocket",
]
ignore_missing_imports = true

# django-axes 8.3.1 ships no type stubs. Import is confined to the DRF lockout
# flag middleware in config.middleware; do not weaken global strictness.
[[tool.mypy.overrides]]
module = [
    "axes.signals",
    "axes.handlers.proxy",
]
ignore_missing_imports = true

# AsyncJsonWebsocketConsumer is Any under the channels override above; this is the
# minimum extra relaxation so GameConsumer can subclass it without a type: ignore.
[[tool.mypy.overrides]]
module = "game.consumers"
disallow_subclassing_any = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "internet: tests requiring live API calls",
    "slow: deterministic extended acceptance tests",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

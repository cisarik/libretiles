# Optional local infrastructure only. Invoke explicitly with
# `docker compose -f docker-compose.dev.yml up -d`.
services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: libretiles
      POSTGRES_USER: libretiles
      POSTGRES_PASSWORD: "${LIBRETILES_DEV_POSTGRES_PASSWORD:?Set a synthetic local password}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4.11-alpine3.21@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  dev_pgdata: {}

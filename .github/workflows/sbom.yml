name: SBOM

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sbom:
    name: cyclonedx
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CycloneDX Python SBOM tool
        run: pip install cyclonedx-bom

      - name: Generate backend CycloneDX SBOM
        run: >
          cyclonedx-py poetry
          --of JSON
          -o "${GITHUB_WORKSPACE}/backend-sbom.json"
          "${GITHUB_WORKSPACE}/backend"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate frontend CycloneDX SBOM
        working-directory: frontend
        run: npm sbom --sbom-format cyclonedx > "${GITHUB_WORKSPACE}/frontend-sbom.json"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sboms
          path: |
            backend-sbom.json
            frontend-sbom.json
          if-no-files-found: error
